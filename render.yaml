services:
  # 1. Django REST Backend API
  - type: web
    name: veloop-backend
    runtime: python
    rootDir: backend_django
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: veloop-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://veloop-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://veloop-frontend.onrender.com,https://veloop-backend.onrender.com"
      - key: JWT_ACCESS_TOKEN_LIFETIME_DAYS
        value: "1"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

  # 2. React / Vite Frontend
  - type: web
    name: veloop-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://veloop-backend.onrender.com/api"

databases:
  # 3. Managed PostgreSQL Database
  - name: veloop-db
    databaseName: veloop_db
    user: veloop_user
    plan: free
